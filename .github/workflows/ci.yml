# Runs the tests and an end-to-end check of the compiled executable on Linux, Windows and macOS.
# The smoke test installs a stand-in agent the way npm does on each platform (claude.cmd on Windows), so the launch
# path real users rely on is exercised on real Windows, not just assumed.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm test
      - run: npm run build:binary
        if: ${{ !cancelled() }}
      - run: node scripts/smoke.mjs
        if: ${{ !cancelled() }}
  # The desktop app's Rust tests. macOS needs no extra libraries (Linux would need WebKitGTK); Windows runs them in
  # desktop-windows.yml. A path filter on one job is not possible, so it always runs; the cache makes it cheap once warm.
  desktop-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      # tauri-build refuses to compile without the sidecar the bundle would ship. The tests never start it, so an empty file stands in.
      - run: |
          mkdir -p desktop/src-tauri/binaries
          touch "desktop/src-tauri/binaries/braid-$(rustc -vV | sed -n 's/^host: //p')"
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

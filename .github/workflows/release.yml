# Builds single-file braid executables and attaches them to a GitHub release.
# Trigger: push a tag like v0.2.0. One Linux job builds every platform: bun cross-compiles
# (macOS arm64 and x64, Windows x64, Linux x64), so there are no per-OS runners to keep alive.
# The desktop app (.dmg) is not built here; it is built and attached by hand for now.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm test
      - run: npm run build:binary -- --all
      - name: Checksums
        run: cd dist/bin && sha256sum braid-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/bin/braid-*
            dist/bin/SHA256SUMS

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>braid</title>
<style>
  :root {
    --bg: #f6f1e7; --panel: #fffdf8; --line: #e2d8c6; --line-2: #d3c7b1; --text: #26222e; --muted: #6f6a78;
    --accent: #7c4dff; --accent-ink: #fff; --hover: #f1eadb; --err: #d64545;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12131c; --panel: #1d1f2d; --line: #2c2f44; --line-2: #3a3e58; --text: #ecebf5; --muted: #9a9cb3;
            --accent: #b48cff; --accent-ink: #1a1230; --hover: #262a3e; --err: #ff6b6b; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 34px 32px 22px; user-select: none; -webkit-user-select: none;
  }
  img { width: 76px; height: 76px; image-rendering: pixelated; }
  h1 { margin: 10px 0 2px; font: 700 26px/1.1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: -0.02em; }
  .tag { color: var(--muted); margin: 0 0 22px; text-align: center; }
  .cta { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn {
    width: 100%; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); padding: 11px 14px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left;
  }
  .btn:hover { background: var(--hover); }
  .btn b { font-weight: 600; }
  .btn small { color: var(--muted); font-size: 12px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary small { color: inherit; opacity: .8; }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  h2 { align-self: flex-start; margin: 22px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  #recent { width: 100%; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; max-height: 190px; }
  .repo { border: 0; background: none; border-radius: 8px; padding: 7px 10px; display: flex; flex-direction: column; align-items: flex-start; text-align: left; width: 100%; }
  .repo:hover { background: var(--hover); }
  .repo b { font-weight: 600; }
  .repo small { color: var(--muted); font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 10px; }
  .foot { margin-top: auto; padding-top: 16px; color: var(--muted); font-size: 12px; text-align: center; }
  .err { color: var(--err); font-size: 12px; min-height: 1.2em; margin-top: 8px; text-align: center; user-select: text; }
  body.busy .btn, body.busy .repo { opacity: .5; pointer-events: none; }
</style>
</head>
<body>
  <img src="knot.png" alt="">
  <h1>braid</h1>
  <p class="tag">Agents that can't merge broken code.</p>

  <div class="cta">
    <button class="btn primary" id="open"><b>Open Repository...</b><small>Watch and run agents in a git repository</small></button>
    <button class="btn" id="demo"><b>Watch a demo run</b><small>A scripted run with mock agents. Nothing is spent.</small></button>
  </div>

  <h2>Recent</h2>
  <div id="recent"><div class="empty">No recent repositories yet.</div></div>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">Cmd+N new window &middot; Cmd+O switch repository</div>

<script>
  const invoke = window.__TAURI__?.core?.invoke;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // The native side does the work and reports failures in its own dialog; the page just waits, then gives up
  // its busy look in case the user cancelled a folder picker.
  function go(command, args) {
    if (!invoke) { $('err').textContent = 'This page only works inside the Braid app.'; return; }
    $('err').textContent = '';
    document.body.classList.add('busy');
    invoke(command, args).catch((e) => { $('err').textContent = String(e); }).finally(() => setTimeout(() => document.body.classList.remove('busy'), 900));
  }

  $('open').addEventListener('click', () => go('launcher_choose'));
  $('demo').addEventListener('click', () => go('launcher_demo'));

  async function loadRecent() {
    if (!invoke) return;
    const repos = await invoke('recent_repos').catch(() => []);
    if (!repos.length) return;
    $('recent').innerHTML = repos.map((p) => {
      const name = p.split(/[\\/]/).filter(Boolean).pop() || p;
      const shown = p.length > 46 ? '\u2026' + p.slice(-45) : p; // keep the end of a long path: that is the part that tells repos apart
      return `<button class="repo" data-path="${esc(p)}"><b>${esc(name)}</b><small title="${esc(p)}">${esc(shown)}</small></button>`;
    }).join('');
    $('recent').querySelectorAll('.repo').forEach((b) => b.addEventListener('click', () => go('launcher_open', { path: b.dataset.path })));
  }
  loadRecent();
  addEventListener('focus', loadRecent);
</script>
</body>
</html>

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(h, target, amt) {

function drawYarnBall(px, yarn, roll) {

/** A little knitted swatch hanging in front of the agent: rows of stitches in two tones. `f` slides the pattern while it is being worked. */
function drawSwatch(px, yarn, y0, rows, f, x0 = 7, x1 = 12) {
  const light = mix(yarn, 'white', .45), dark = mix(yarn, 'black', .25);
  for (let r = 0; r < rows; r++) {
    const from = r === rows - 1 && rows > 2 ? x0 + 1 : x0, to = r === rows - 1 && rows > 2 ? x1 - 1 : x1;
    for (let x = from; x <= to; x++) px(x, y0 + r, (x + r + f) % 2 ? yarn : light);

/**
 * 24x24 pixel blob (20x20 body art drawn at an offset, so there is room for wool). Original art drawn procedurally:
 * a round body, a braided tuft on top, a face, and wool props that change with mood. The wool is the task's colour,

  let rx = 6.5, ry = 5.5, cy = 12.5, bob = 0;

  if (mood === 'happy') bob = [0, -1][f % 2];
  if (mood === 'sleep') { rx = 6.5 + (f % 8 < 4 ? .3 : 0); ry = 5.5 - (f % 8 < 4 ? .3 : 0); }

      for (let x = 4; x < 16; x++) if (inside(x, Math.round(cy) + 4)) px(x, Math.round(cy) + 4, x % 2 ? yarn : yarnDark);

    case 'inspect': {

      drawSwatch(px, yarn, ly, 3, 0);
      [[14,7],[15,7],[16,7],[13,8],[17,8],[13,9],[17,9],[14,10],[15,10],[16,10]].forEach(([x, y]) => px(x, y + bob, '#c9c6d8'));

}

        { id: "auth", title: "Token auth middleware", color: "#3cc8b4", x: 96, y: 410 },
        { id: "errors", title: "Error responses", color: "#f5b942", x: 96, y: 590 },
        { id: "routes", title: "CRUD routes", color: "#9b7bff", x: 516, y: 230 },
        { id: "docs", title: "API reference", color: "#8fd14f", x: 516, y: 410 },
        { id: "tests", title: "Route tests", color: "#5aa9ff", x: 936, y: 230 },
        { id: "sdk", title: "Typed client SDK", color: "#ff9a4d", x: 936, y: 410 }
      ];
      var BY = {}; TASKS.forEach(function (t) { BY[t.id] = t; });
      var DEPS = [["schema", "routes"], ["auth", "routes"], ["errors", "routes"], ["schema", "docs"], ["routes", "tests"], ["routes", "sdk"]];

      function status(id, t) {
        if (id === "schema") return t < T_SCHEMA_MERGE ? "verifying" : t < T_SCHEMA_DONE ? "merging" : "done";
        if (id === "auth") return t < T_AUTH_FAIL ? "verifying" : t < T_AUTH_RETRY ? "failed" : "running";
        if (id === "errors") return t < T_ERR_MERGE ? "verifying" : t < T_ERR_DONE ? "merging" : "done";
        return "pending";
      }
      function attempts(id, t) { if (id === "auth") return t < T_AUTH_RETRY ? 1 : 2; if (id === "schema" || id === "errors") return 1; return 0; }
      var MOOD = { pending: "sleep", verifying: "inspect", merging: "jump", done: "happy", failed: "dead", running: "work" };
      var CHIP = { pending: ["#2c2f44", "#9a9cb3"], verifying: ["#182a40", "#6cb6ff"], running: ["#182a40", "#6cb6ff"], merging: ["#182a40", "#6cb6ff"], done: ["#173327", "#3fcf8e"], failed: ["#3b1d22", "#ff6b6b"] };
      var ACTIVE = ["running", "verifying", "merging"];

      var COST = {
        schema: [[0, .16], [T_SCHEMA_MERGE, .30], [T_SCHEMA_DONE, .31]],
        auth: [[0, .14], [T_AUTH_FAIL, .26], [T_AUTH_RETRY, .26], [DUR, .52]],
        errors: [[0, .10], [T_ERR_MERGE, .26], [T_ERR_DONE, .27]]
      };
      function cost(id, t) {
        var k = COST[id]; if (!k) return 0;
        if (t <= k[0][0]) return k[0][1];
        for (var i = 1; i < k.length; i++) if (t <= k[i][0]) { var a = k[i - 1], b = k[i]; return a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0]); }
        return k[k.length - 1][1];
      }

      /* ---- desks ---- */
      var desks = {};
      TASKS.forEach(function (t) {
        var d = div("g06-desk", root); d.style.left = t.x + "px"; d.style.top = t.y + "px";
        var bar = div("g06-bar", d); bar.style.background = t.color;
        var cv = document.createElement("canvas"); cv.className = "g06-cv"; cv.width = 24; cv.height = 24; d.appendChild(cv);
        var tx = div("g06-txt", d);
        var r1 = div("g06-r1", tx); var id = document.createElement("span"); id.textContent = t.id; r1.appendChild(id);
        var cs = document.createElement("span"); cs.className = "g06-cost"; r1.appendChild(cs);
        var ti = div("g06-title", tx); ti.textContent = t.title;
        var r3 = div("g06-r3", tx); var chip = document.createElement("span"); chip.className = "g06-chip"; r3.appendChild(chip);
        var dots = div("g06-dots", r3); var dd = [0, 1, 2].map(function () { return document.createElement("i"); }); dd.forEach(function (i) { dots.appendChild(i); });
        desks[t.id] = { el: d, cv: cv, ctx: cv.getContext("2d"), chip: chip, cost: cs, dots: dd, color: t.color };
      });

      /* ---- threads between desks ---- */
      var svg = $("g06-threads");
      var thr = DEPS.map(function (p) {
        var a = BY[p[0]], b = BY[p[1]];
        var x1 = a.x + 330, y1 = a.y + 75, x2 = b.x, y2 = b.y + 75, mx = (x1 + x2) / 2;
        var d = "M" + x1 + "," + y1 + " C" + mx + "," + y1 + " " + mx + "," + y2 + " " + x2 + "," + y2;
        var g = el("g", {}, svg);
        var wool = el("path", { d: d, stroke: a.color, "stroke-width": 3 }, g);
        var twist = el("path", { d: d, stroke: "rgba(255,255,255,.55)", "stroke-width": 3, "stroke-dasharray": "2 8", "stroke-linecap": "butt" }, g);
        var knot = el("circle", { cx: x2, cy: y2, r: 5 }, g);
        return { src: p[0], dst: p[1], wool: wool, twist: twist, knot: knot, color: a.color };
      });
      var spools = {};
      DEPS.forEach(function (p) { if (spools[p[0]]) return; var a = BY[p[0]]; spools[p[0]] = el("circle", { cx: a.x + 330, cy: a.y + 75, r: 6, fill: a.color, stroke: "rgba(0,0,0,.3)", "stroke-width": 1.5 }, svg); });

      // threads that carry a merged strand to the braid panel
      var RX = 1352, RY = 246, SEG = 78, TOP = 14, CX = 27;
      var mThr = [
        { d: "M261,230 V212 H1336 V" + (RY + TOP + SEG / 2) + " H1368", color: "#ff7a90", t0: T_SCHEMA_MERGE, t1: L1 },
        { d: "M426,665 H1336 V" + (RY + TOP + SEG * 1.5) + " H1368", color: "#f5b942", t0: T_ERR_MERGE, t1: L2 }
      ];
      mThr.forEach(function (m) { m.path = el("path", { d: m.d, stroke: m.color, "stroke-width": 3, pathLength: 1, "stroke-dasharray": "1 2" }, svg); });

      /* ---- the braid (rope) ---- */
      var rope = $("g06-rope");
      var knotTop = el("rect", { x: CX - 14, y: 2, width: 28, height: 10, rx: 3, fill: "#3a3e58" }, rope);
      var segs = [0, 1].map(function (i) {
        return [0, 1, 2].map(function (k) {
          var pts = [];
          for (var s = 0; s <= 12; s++) { var y = TOP + i * SEG + (s / 12) * SEG; var x = CX + Math.sin(((y - TOP) / SEG) * Math.PI * 2 + k * (Math.PI * 2 / 3)) * 11; pts.push(x.toFixed(1) + "," + y.toFixed(1)); }
          return el("polyline", { points: pts.join(" "), fill: "none", "stroke-width": 5, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": "1 2" }, rope);
        });
      });
      var tail = el("g", {}, rope);
      [-11, 0, 11].forEach(function (dx) { el("line", { x1: CX + dx, y1: TOP, x2: CX + dx, y2: TOP + 96, stroke: "#3a3e58", "stroke-width": 3, "stroke-dasharray": "3 5" }, tail); });
      var beads = [0, 1].map(function (i) { return el("rect", { x: CX - 10, y: TOP + i * SEG + SEG / 2 - 10, width: 20, height: 20, rx: 4, stroke: "#1d1f2d", "stroke-width": 3 }, rope); });
      var LAND = [L1, L2], BEADC = ["#ff7a90", "#f5b942"], BEADID = ["schema", "errors"], BEADT = ["Note schema and validation", "Error responses"];
      var lbls = [0, 1].map(function (i) {
        var l = div("g06-lbl", root); l.style.top = (RY + TOP + i * SEG + SEG / 2 - 14) + "px";
        l.innerHTML = '<b style="color:' + BEADC[i] + '">' + BEADID[i] + "</b><em>" + BEADT[i] + "</em>";
        return l;
      });
      var togo = $("g06-togo");

      /* ---- verify strips ---- */
      function mkStrip(task, parts, t0, cps) {
        var s = div("g06-strip", root); s.style.left = task.x + "px"; s.style.top = (task.y + 152) + "px";
        var full = document.createElement("span"); full.className = "full"; var typed = document.createElement("span"); typed.className = "typed";
        s.appendChild(full); s.appendChild(typed);
        var total = 0, html = ""; parts.forEach(function (p) { total += p[0].length; html += '<span class="' + (p[1] || "") + '">' + p[0] + "</span>"; });
        full.innerHTML = html;
        return { el: s, typed: typed, parts: parts, total: total, t0: t0, cps: cps };
      }
      var strips = [
        mkStrip(BY.schema, [["schema verify · ", ""], ["npm test", "cmd"], [" -> ", ""], ["pass", "ok"]], T_SHRINK, 105),
        mkStrip(BY.auth, [["auth verify · ", ""], ["node check.js", "cmd"], [" -> ", ""], ["fail (1)", "err"]], T_SCHEMA_DONE, 100),
        mkStrip(BY.errors, [["errors verify · ", ""], ["npm test", "cmd"], [" -> ", ""], ["pass", "ok"]], T_AUTH_RETRY, 100)
      ];
      strips[1].tEnd = T_AUTH_RETRY; // cleared when auth snaps back
      function typedHtml(s, n) {
        var out = "", left = n;
        for (var i = 0; i < s.parts.length && left > 0; i++) { var p = s.parts[i], take = p[0].slice(0, left); left -= take.length; out += '<span class="' + (p[1] || "") + '">' + take + "</span>"; }
        return out;
      }

      /* ---- sprites ---- */
      var KNOT = window.BraidSprites.KNOT, knotCv = $("g06-knot"), knotCtx = knotCv.getContext("2d");
      function sprite(o, ctx, color, mood, f, tuft) { var k = mood + "|" + f; if (o.__sk === k) return; o.__sk = k; window.BraidSprites.drawBlob(ctx, color, mood, f, tuft); }

      var bubble = $("g06-bubble");
      var BUB = [
        '<span>Weaving 3 strands. 0 braided, 4 waiting.</span>',
        '<span>auth failed <code>node check.js</code>. Sending it back with the output.</span>',
        '<span>Weaving 1 strand. 2 braided, 4 waiting.</span>'
      ];

      var punch = $("g06-punch"), band = $("g06-band");

      function renderAt(t) {
        t = clamp(t, 0, DUR);
        var f = Math.floor(t * 8);

        /* punchline strip -> caption */
        var u = t < T_SHRINK ? 0 : easeOut(clamp((t - T_SHRINK) / 0.26, 0, 1));
        put(band, "display", t < T_SHRINK ? "block" : "none");
        put(punch, "transform", "translate(" + (206 * u).toFixed(2) + "px," + (-22 * u).toFixed(2) + "px) scale(" + (1 + (44 / 96 - 1) * u).toFixed(4) + ")");
        var showTitles = t >= T_SHRINK + 0.2 ? "inherit" : "hidden";
        put($("g06-ttl-floor"), "visibility", showTitles); put($("g06-ttl-braid"), "visibility", showTitles);

        /* header */
        var kmood = t < T_AUTH_FAIL ? "work" : t < T_ERR_DONE ? "inspect" : "work";
        sprite(knotCv, knotCtx, KNOT.color, kmood, f, KNOT.tuft);
        var bi = t < T_AUTH_FAIL ? 0 : t < T_ERR_DONE ? 1 : 2;
        put(bubble, "html", BUB[bi]);
        var bt = bi === 0 ? 1 : bi === 1 ? T_AUTH_FAIL : T_ERR_DONE;
        var bp = bi === 0 ? 1 : easeOut(clamp((t - bt) / 0.14, 0, 1));
        put(bubble, "transform", "scale(" + (0.94 + 0.06 * bp).toFixed(3) + ")");

        var merged = (t >= L2 ? 2 : t >= L1 ? 1 : 0);
        put($("g06-merged"), "text", merged + "/7");
        var flash = (t >= L1 && t - L1 < 0.5) || (t >= L2 && t - L2 < 0.5);
        put($("g06-merged"), "color", flash ? "#b48cff" : "#ecebf5");

        /* desks */
        var total = 0;
        TASKS.forEach(function (tk) {
          var D = desks[tk.id], s = status(tk.id, t), a = attempts(tk.id, t);
          sprite(D, D.ctx, tk.color, MOOD[s], f);
          var c = CHIP[s]; put(D.chip, "text", s); put(D.chip, "background", c[0]); put(D.chip, "color", c[1]);
          var cv = Math.round(cost(tk.id, t) * 100) / 100; total += cv; put(D.cost, "text", "$" + cv.toFixed(2));
          for (var i = 0; i < 3; i++) {
            var used = i < a, bad = used && (i < a - 1 || s === "failed");
            put(D.dots[i], "background", bad ? "#ff6b6b" : used ? tk.color : "#3a3e58");
          }
          var fail = s === "failed";
          put(D.el, "borderColor", fail ? "#ff6b6b" : "#2c2f44");
          put(D.el, "background", fail ? "#2d2030" : "#232638");
          // a hard three-step jolt when the gate says no
          var sh = 0;
          if (tk.id === "auth" && t >= T_AUTH_FAIL && t < T_AUTH_FAIL + 0.15) { var q = Math.floor((t - T_AUTH_FAIL) / 0.05); sh = [-5, 5, -3][q] || 0; }
          put(D.el, "transform", "translateX(" + sh + "px)");
        });
        put($("g06-spend"), "text", "$" + total.toFixed(2));

        /* threads */
        thr.forEach(function (h) {
          var s = status(h.src, t), d = status(h.dst, t), kind;
          if (s === "done") kind = ACTIVE.indexOf(d) >= 0 ? "feeding" : "ready"; else if (s === "failed") kind = "snapped"; else kind = "unspun";
          var op = kind === "unspun" ? 0.3 : kind === "snapped" ? 0.25 : 0.95;
          put(h.wool, "a:opacity", op);
          put(h.wool, "a:stroke-dasharray", kind === "unspun" ? "1 8" : kind === "snapped" ? "3 9" : "none");
          put(h.twist, "a:opacity", (kind === "ready" || kind === "feeding") ? 0.8 : 0);
          h.twist.setAttribute("stroke-dashoffset", (-t * 36).toFixed(2));
          var live = kind === "ready" || kind === "feeding";
          put(h.knot, "a:fill", live ? h.color : "#1d1f2d"); put(h.knot, "a:stroke", live ? "rgba(0,0,0,.35)" : h.color);
          put(h.knot, "a:stroke-width", live ? 1.5 : 2); put(h.knot, "a:opacity", live ? 1 : 0.5);
        });
        mThr.forEach(function (m) {
          var p = clamp((t - m.t0) / (m.t1 - m.t0), 0, 1), e = easeOut(p);
          put(m.path, "a:stroke-dashoffset", (1 - e).toFixed(4));
          var op = t < m.t0 ? 0 : t < m.t1 ? 1 : 1 - 0.55 * clamp((t - m.t1) / 0.3, 0, 1);
          put(m.path, "a:opacity", op.toFixed(3));
        });

        /* rope */
        var ropeOn = t >= T_SCHEMA_MERGE;
        put(rope, "visibility", ropeOn ? "inherit" : "hidden");
        put($("g06-empty"), "display", t >= T_SHRINK && !ropeOn ? "block" : "none");
        put($("g06-empty"), "visibility", t >= T_SHRINK && !ropeOn ? "inherit" : "hidden");
        var m = t >= L2 - 0.05 ? 2 : t >= L1 - 0.05 ? 1 : 0, prog = 0;
        for (var i = 0; i < 2; i++) {
          var L = LAND[i], p = easeOut(clamp((t - (L - 0.05)) / 0.3, 0, 1)); prog += p;
          segs[i].forEach(function (pl, k) {
            var col = m === 0 ? "#3a3e58" : (m === 1 ? BEADC[0] : BEADC[(i + k) % 2]);
            put(pl, "a:stroke", col); put(pl, "a:stroke-dashoffset", (1 - p).toFixed(4)); put(pl, "a:opacity", p > 0 ? 1 : 0);
          });
          var x = clamp((t - L) / 0.22, 0, 1), sc = t < L ? 0 : backOut(x), dy = -18 * (1 - easeOut(x));
          var cy = TOP + i * SEG + SEG / 2;
          put(beads[i], "a:fill", BEADC[i]);
          put(beads[i], "a:transform", "translate(" + CX + "," + (cy + dy).toFixed(2) + ") scale(" + sc.toFixed(3) + ") translate(" + (-CX) + "," + (-cy) + ")");
          put(beads[i], "a:opacity", t < L ? 0 : 1);
          put(lbls[i], "visibility", t >= L + 0.08 ? "inherit" : "hidden");
        }
        put(tail, "a:transform", "translate(0," + (SEG * prog).toFixed(2) + ")");
        var remain = 7 - merged;
        put(togo, "text", remain + " strands to go");
        put(togo, "top", (RY + TOP + SEG * prog + 22 - 14).toFixed(1) + "px");
        put(togo, "visibility", ropeOn ? "inherit" : "hidden");

        /* verify strips */
        strips.forEach(function (s) {
          var on = t >= s.t0 && !(s.tEnd && t >= s.tEnd);
          put(s.el, "visibility", on ? "inherit" : "hidden");
          var n = clamp(Math.floor((t - s.t0) * s.cps) + 1, 0, s.total);
          put(s.typed, "html", on ? typedHtml(s, n) : "");
        });
      }

      renderAt(0);
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var proxy = { t: 0 };
      // one seekable driver: every state above is a pure function of the timeline time
      tl.to(proxy, { t: DUR, duration: DUR, ease: "none", modifiers: { t: function (v) { renderAt(v); return v; } }, onUpdate: function () { renderAt(tl.time()); } }, 0);
      window.__timelines["06-gate"] = tl;
    })();
  </script>
</template>
